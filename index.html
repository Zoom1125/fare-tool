<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>公務出差票價查詢與核銷核對工具</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --accent: #d97706;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --line: #e2e8f0;
      --text-main: #1e293b;
      --text-sub: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); padding: 24px 16px; }
    .container { max-width: 1100px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 24px; }
    header h1 { font-size: 26px; color: var(--primary); margin-bottom: 8px; }
    header p { color: var(--text-sub); font-size: 14px; }
    .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 768px) { .main-grid { grid-template-columns: 1fr; } }
    .card { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--line); padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .card-title { font-size: 18px; font-weight: 700; color: var(--primary); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; border-bottom: 2px solid var(--line); padding-bottom: 8px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 13px; font-weight: 600; color: var(--text-sub); margin-bottom: 6px; }
    select, input { width: 100%; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 8px; font-size: 15px; outline: none; transition: border-color 0.2s; }
    select:focus, input:focus { border-color: var(--accent); }
    .station-selects { display: flex; align-items: center; gap: 10px; }
    .btn-action { width: 100%; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
    .btn-action:hover { opacity: 0.9; }
    .price-display { margin-top: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .price-box { border: 1px solid var(--line); border-radius: 8px; padding: 12px; text-align: center; background: #fdfdfd; }
    .price-box.highlight { border-color: var(--accent); background: #fffbeb; }
    .price-box .tag { font-size: 12px; color: var(--text-sub); margin-bottom: 4px; }
    .price-box .val { font-size: 20px; font-weight: 800; color: var(--primary); }
    .price-box .val.accent { color: var(--accent); }
    .result-list { margin-top: 16px; max-height: 380px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .match-item { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; font-size: 14px; background: white; border-left: 4px solid var(--primary); }
    .match-tag { font-size: 11px; font-weight: 700; color: var(--accent); margin-bottom: 2px; }
    .desc-note { font-size: 12px; color: var(--text-sub); margin-top: 8px; line-height: 1.5; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>票價查詢核對工具</h1>
    <p>左側依交通工具查詢官方票價；右側輸入核銷金額反查單程、來回與共用轉折站組合</p>
  </header>

  <div class="main-grid">
    <!-- 左側：票價正向查詢 -->
    <div class="card">
      <div class="card-title">🔍 票價查詢</div>
      <div class="form-group">
        <label>交通工具</label>
        <select id="transportSelect">
          <option value="thsr">台灣高鐵</option>
        </select>
      </div>

      <div class="form-group">
        <label>起訖站點</label>
        <div class="station-selects">
          <select id="startStation" onchange="calcFare()"></select>
          <span>➔</span>
          <select id="endStation" onchange="calcFare()"></select>
        </div>
      </div>

      <div class="price-display">
        <div class="price-box highlight">
          <div class="tag">標準車廂・對號座</div>
          <div class="val accent" id="seatStandard">NT$ 0</div>
        </div>
        <div class="price-box">
          <div class="tag">標準車廂・自由座</div>
          <div class="val" id="seatFree">NT$ 0</div>
        </div>
        <div class="price-box">
          <div class="tag">商務車廂</div>
          <div class="val" id="seatBusiness">NT$ 0</div>
        </div>
        <div class="price-box">
          <div class="tag">半價優待（敬老/愛心/兒童）</div>
          <div class="val" id="seatHalf">NT$ 0</div>
        </div>
      </div>
      <div class="desc-note">註：半價優待為標準車廂對號座之半價；南港—台北、南港—板橋、台北—板橋區間不發售商務車廂。</div>
    </div>

    <!-- 右側：核銷金額反查 -->
    <div class="card">
      <div class="card-title">🎯 核銷金額反查</div>
      <div class="form-group">
        <label>選擇交通工具</label>
        <select>
          <option>台灣高鐵</option>
        </select>
      </div>
      <div class="form-group">
        <label>輸入核銷金額 (NT$)</label>
        <input type="number" id="inputAmount" placeholder="例如：1580、2670" />
      </div>
      <button class="btn-action" onclick="reverseMatch()">開始反查</button>

      <div class="result-list" id="matchResults">
        <div style="text-align: center; color: var(--text-sub); font-size: 13px; margin-top: 20px;">請輸入金額並點擊反查</div>
      </div>
    </div>
  </div>
</div>

<script>
// 高鐵標準 12 站清單
const stations = ["南港", "台北", "板橋", "桃園", "新竹", "苗栗", "台中", "彰化", "雲林", "嘉義", "台南", "左營"];

// 台北出發到各站的標準對號座全票基準里程/票價表 (依序為 0:南港, 1:台北, 2:板橋 ... 11:左營)
const fareTable = [
  [0, 40, 70, 200, 330, 480, 750, 870, 970, 1120, 1390, 1530], // 南港
  [40, 0, 40, 160, 290, 430, 700, 820, 930, 1080, 1350, 1490], // 台北
  [70, 40, 0, 130, 260, 400, 670, 790, 900, 1050, 1320, 1460], // 板橋
  [200, 160, 130, 0, 130, 280, 540, 670, 780, 920, 1190, 1330], // 桃園
  [330, 290, 260, 130, 0, 140, 410, 540, 640, 790, 1060, 1200], // 新竹
  [480, 430, 400, 280, 140, 0, 270, 390, 500, 640, 920, 1060],  // 苗栗
  [750, 700, 670, 540, 410, 270, 0, 130, 230, 380, 650, 790],   // 台中
  [870, 820, 790, 670, 540, 390, 130, 0, 110, 250, 530, 670],   // 彰化
  [970, 930, 900, 780, 640, 500, 230, 110, 0, 150, 420, 560],   // 雲林
  [1120, 1080, 1050, 920, 790, 640, 380, 250, 150, 0, 280, 410],// 嘉義
  [1390, 1350, 1320, 1190, 1060, 920, 650, 530, 420, 280, 0, 140],// 台南
  [1530, 1490, 1460, 1330, 1200, 1060, 790, 670, 560, 410, 140, 0]// 左營
];

// 初始化站點下拉選單
function init() {
  const start = document.getElementById("startStation");
  const end = document.getElementById("endStation");
  stations.forEach((s, idx) => {
    start.add(new Option(s, idx));
    end.add(new Option(s, idx));
  });
  start.value = 1; // 預設台北
  end.value = 10;  // 預設台南
  calcFare();
}

// 正向查詢計算
function calcFare() {
  const s = parseInt(document.getElementById("startStation").value);
  const e = parseInt(document.getElementById("endStation").value);
  const std = fareTable[s][e];
  
  if (std === 0) {
    document.getElementById("seatStandard").innerText = "NT$ 0";
    document.getElementById("seatFree").innerText = "NT$ 0";
    document.getElementById("seatBusiness").innerText = "NT$ 0";
    document.getElementById("seatHalf").innerText = "NT$ 0";
    return;
  }

  // 自由座概算（約97折，以5元取整）
  const free = Math.round((std * 0.97) / 5) * 5;
  // 半價
  const half = Math.floor(std / 2);
  // 商務座（近程不發售則標示）
  let biz = "不發售";
  if (!((s === 0 && e <= 2) || (s === 1 && e <= 2) || (s === 2 && e <= 1))) {
    biz = "NT$ " + (std + Math.round(std * 0.65)).toLocaleString();
  }

  document.getElementById("seatStandard").innerText = "NT$ " + std.toLocaleString();
  document.getElementById("seatFree").innerText = "NT$ " + free.toLocaleString();
  document.getElementById("seatBusiness").innerText = biz;
  document.getElementById("seatHalf").innerText = "NT$ " + half.toLocaleString();
}

// 核心：反查配對演算法 (包含單程、來回、以及共用轉折站的多段組合)
function reverseMatch() {
  const target = parseInt(document.getElementById("inputAmount").value);
  const resultsDiv = document.getElementById("matchResults");
  resultsDiv.innerHTML = "";

  if (isNaN(target) || target <= 0) {
    resultsDiv.innerHTML = `<div style="text-align: center; color: red; font-size: 13px;">請輸入有效金額</div>`;
    return;
  }

  let matches = [];

  // 1. 單程比對
  for (let i = 0; i < stations.length; i++) {
    for (let j = 0; j < stations.length; j++) {
      if (i === j) continue;
      const fare = fareTable[i][j];
      if (fare === target) {
        matches.push({
          type: "單程相符",
          text: `${stations[i]} ➔ ${stations[j]} (標準對號座全票)`,
          amount: fare
        });
      }
    }
  }

  // 2. 同站來回比對
  for (let i = 0; i < stations.length; i++) {
    for (let j = i + 1; j < stations.length; j++) {
      const fare = fareTable[i][j] * 2;
      if (fare === target) {
        matches.push({
          type: "同站來回相符",
          text: `去程：${stations[i]} ➔ ${stations[j]} ＋ 回程：${stations[j]} ➔ ${stations[i]}`,
          amount: fare
        });
      }
    }
  }

  // 3. 多段不同站（共用一個轉折站點，例如：去程 A->B，回程 B->C）
  for (let b = 0; b < stations.length; b++) { // B 為轉折點
    for (let a = 0; a < stations.length; a++) {
      if (a === b) continue;
      for (let c = 0; c < stations.length; c++) {
        if (c === b || c === a) continue; // 避免與同站來回重複
        const cost = fareTable[a][b] + fareTable[b][c];
        if (cost === target) {
          matches.push({
            type: "共用轉折站組合",
            text: `去程：${stations[a]} ➔ ${stations[b]} (${fareTable[a][b]}元) ＋ 回程：${stations[b]} ➔ ${stations[c]} (${fareTable[b][c]}元) [轉折點：${stations[b]}]`,
            amount: cost
          });
        }
      }
    }
  }

  if (matches.length === 0) {
    resultsDiv.innerHTML = `<div style="text-align: center; color: var(--text-sub); font-size: 13px; margin-top: 20px;">未找到剛好為 NT$ ${target} 的高鐵組合，請確認是否有加計計程車、公車或部分優待票種。</div>`;
    return;
  }

  matches.forEach(m => {
    const item = document.createElement("div");
    item.className = "match-item";
    item.innerHTML = `
      <div class="match-tag">【${m.type}】NT$ ${m.amount}</div>
      <div>${m.text}</div>
    `;
    resultsDiv.appendChild(item);
  });
}

window.onload = init;
</script>
</body>
</html>
